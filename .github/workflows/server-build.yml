# Builds a server's images and pushes them to GitHub's container registry:
#   push to main          -> demo images     ghcr.io/<owner>/opencon-*
#   push to client/<name> -> client images   ghcr.io/<owner>/opencon-<name>-*
# so a client server only changes when its own branch changes (merge main into
# client/<name> to give that client the latest core). If the matching server
# is running, it is updated straight away; otherwise its next start uses them.
# Building here keeps the small droplet from ever running the frontend build,
# which needs about 14 GB of memory.

name: Build server images

on:
  push:
    branches: [main, "client/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/opencon
  # demo for main, the client name for client/<name>
  INSTANCE: ${{ startsWith(github.ref_name, 'client/') && github.ref_name || 'demo' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Work out image names
        run: |
          inst="${INSTANCE#client/}"
          echo "INSTANCE=$inst" >> "$GITHUB_ENV"
          if [ "$inst" = demo ]; then echo "IMAGE_PREFIX=$IMAGE_BASE" >> "$GITHUB_ENV"
          else echo "IMAGE_PREFIX=$IMAGE_BASE-$inst" >> "$GITHUB_ENV"; fi

      # The frontend type check and Vite build need well over 8 GB; extra
      # swap keeps the 16 GB runner from running out.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/build-swap
          sudo chmod 600 /mnt/build-swap
          sudo mkswap /mnt/build-swap
          sudo swapon /mnt/build-swap
          free -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.unified
          target: api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  update-running-demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: server-${{ startsWith(github.ref_name, 'client/') && github.ref_name || 'demo' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DO_REGION: ${{ vars.DO_REGION || 'blr1' }}
      DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN }}
      MAX_HOURS: ${{ vars.DEMO_MAX_HOURS || '8' }}
      IMAGE_TAG: ${{ github.sha }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -n "$DO_TOKEN" ] && [ -n "$DO_SSH_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.setup.outputs.ready == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
      - name: Update the server if it is running
        if: steps.setup.outputs.ready == 'true'
        run: |
          export INSTANCE="${INSTANCE#client/}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" | tr -d '\r' > ~/.ssh/demo
          chmod 600 ~/.ssh/demo
          bash deploy/demo/do-demo.sh redeploy
