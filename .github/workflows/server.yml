# Start or stop a throwaway server on DigitalOcean (Bengaluru).
#
# Actions tab > "Start or stop a server" > Run workflow, then pick:
#   server: demo  the public demo, built from main
#           bel   the BEL client server, built from the client/bel branch
#   action: start or stop
#
# Each server has its own droplet, its own data volume and its own images, so
# the BEL database never mixes with the demo's. "start" creates the droplet,
# attaches that server's volume and deploys the latest images built for it;
# "stop" backs up the database onto the volume and destroys the droplet so it
# stops costing money. An hourly check stops any server left running longer
# than DEMO_MAX_HOURS (default 8).
#
# To add another client: add its name to the "server" options below and create
# a client/<name> branch (see deploy/demo/README.md).
#
# Needs, in Settings > Secrets and variables > Actions:
#   Secrets:   DO_TOKEN, DO_SSH_KEY
#   Variables (all optional): DEMO_DOMAIN (demo server only), DEMO_MAX_HOURS, DO_REGION

name: Start or stop a server

on:
  workflow_dispatch:
    inputs:
      server:
        description: Which server
        type: choice
        options: [demo, bel]
        default: demo
      action:
        description: Start or stop it
        type: choice
        options: [start, stop]
        default: start
      size:
        description: Server size (start only)
        type: choice
        options:
          - s-2vcpu-4gb   # about $0.036 an hour
          - s-4vcpu-8gb   # about $0.071 an hour, for heavier use
        default: s-2vcpu-4gb
  schedule:
    - cron: "17 * * * *"

concurrency:
  # Same group names as the update job in server-build.yml.
  group: server-${{ (inputs.server && inputs.server != 'demo') && format('client/{0}', inputs.server) || 'demo' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INSTANCE: ${{ inputs.server || 'demo' }}
      DO_REGION: ${{ vars.DO_REGION || 'blr1' }}
      DO_SIZE: ${{ inputs.size || 's-2vcpu-4gb' }}
      DEMO_DOMAIN: ${{ inputs.server == 'demo' && vars.DEMO_DOMAIN || '' }}
      MAX_HOURS: ${{ vars.DEMO_MAX_HOURS || '8' }}
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/opencon
      IMAGE_TAG: latest
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$DO_TOKEN" ] || [ -z "$DO_SSH_KEY" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Add the DO_TOKEN and DO_SSH_KEY secrets first (see deploy/demo/README.md)"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The deploy scripts come from the server's own branch, so a client
      # server runs exactly the setup that was built for it.
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.server && inputs.server != 'demo') && format('client/{0}', inputs.server) || github.event.repository.default_branch }}

      - if: steps.setup.outputs.ready == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Load SSH key
        if: steps.setup.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" | tr -d '\r' > ~/.ssh/demo
          chmod 600 ~/.ssh/demo

      - name: Start ${{ inputs.server }}
        if: steps.setup.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.action == 'start'
        run: bash deploy/demo/do-demo.sh up

      - name: Stop ${{ inputs.server }}
        if: steps.setup.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.action == 'stop'
        run: bash deploy/demo/do-demo.sh down

      - name: Stop servers left running too long
        if: steps.setup.outputs.ready == 'true' && github.event_name == 'schedule'
        run: bash deploy/demo/do-demo.sh autostop
