# Builds the demo images on every push to main (or by hand) and pushes them to
# GitHub's container registry. If a demo server happens to be running, it is
# updated to the new images straight away; otherwise the next "Demo server >
# start" uses them. Building here keeps the small droplet from ever running
# the frontend build, which needs about 14 GB of memory.

name: Build demo images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: demo-build
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/opencon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The frontend type check and Vite build need well over 8 GB; extra
      # swap keeps the 16 GB runner from running out.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/build-swap
          sudo chmod 600 /mnt/build-swap
          sudo mkswap /mnt/build-swap
          sudo swapon /mnt/build-swap
          free -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.unified
          target: api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  update-running-demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: demo-server
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DO_REGION: ${{ vars.DO_REGION || 'blr1' }}
      DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN }}
      MAX_HOURS: ${{ vars.DEMO_MAX_HOURS || '8' }}
      IMAGE_TAG: ${{ github.sha }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -n "$DO_TOKEN" ] && [ -n "$DO_SSH_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.setup.outputs.ready == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
      - name: Update the demo if it is running
        if: steps.setup.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" | tr -d '\r' > ~/.ssh/demo
          chmod 600 ~/.ssh/demo
          bash deploy/demo/do-demo.sh redeploy
